# Alembic. La URL de la BD NO se escribe aqui: sale de DATABASE_URL (ver app/config.py) o de `-x url=...`.
#   cd server
#   .venv/Scripts/alembic upgrade head
#   .venv/Scripts/alembic revision --autogenerate -m "cambio"     (revisar el archivo generado a mano)
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
