[pytest]
testpaths = tests
addopts = -rfE
# un hilo de prueba que revienta sin que nadie lo vea (p. ej. `res.append(agenda.book(...))` en un Thread) ya no pasa en silencio
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
markers =
    mysql: prueba que corre contra MySQL 8 real (se salta si no esta configurado; ver tests/conftest.py)
